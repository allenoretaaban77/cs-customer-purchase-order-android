apply plugin: 'com.android.application'

android {

    compileSdkVersion 28

    buildToolsVersion "28.0.3"

    defaultConfig {
        applicationId "com.fnc.receiving.android"
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs =['src/main/assets', 'src/main/assets/']
            resources.srcDirs = ['src/main/resources', 'src/main/resources/']
        }
    }

    // Temporary fix until alpha10
    packagingOptions {
        exclude 'META-INF/proguard/androidx-annotations.pro'
    }

    dataBinding {
        enabled = true
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/INDEX.LIST'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    implementation 'com.andreabaccega:android-form-edittext:1.2.1@aar'
    implementation 'android.arch.lifecycle:extensions:1.1.1'
    implementation 'com.balysv:material-ripple:1.0.2'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.jaredrummler:material-spinner:1.3.1'
    implementation 'gun0912.ted:tedpermission:2.2.2'
    implementation 'com.shehabic.droppy:Droppy:0.6.0@aar'
    implementation 'com.github.florent37:materialtextfield:1.0.7'
    implementation 'io.reactivex:rxandroid:1.2.1'
    implementation 'io.reactivex:rxjava:1.2.1'
//    implementation 'com.android.volley:volley:1.1.0'
    implementation 'com.github.yangweigbh:volleyx:1.1.0'
    implementation 'com.daimajia.swipelayout:library:1.2.0@aar'
    implementation 'hari.bounceview:bounceview:0.1.0'
    implementation 'android.arch.lifecycle:extensions:1.1.1'
    implementation 'com.nightonke:boommenu:2.1.1'
    implementation 'com.infideap.drawerbehavior:drawer-behavior:0.2.2'

    // recycler view
    implementation 'com.todkars:shimmer-recyclerview:0.3.0' // loader=
    implementation 'com.izikode.izilib:accordionrecycler:0.5' // collapsible=
    implementation 'com.dc.easyadapter:easyadapter:2.0.3' // swipe and adapter

    implementation 'com.google.cloud:google-cloud-storage:1.84.0'
    implementation 'com.google.cloud:google-cloud-datastore:1.84.0'
    implementation 'org.jsoup:jsoup:1.12.1'
    implementation 'com.mikhaellopez:rxanimation:0.0.6' // animation
}
